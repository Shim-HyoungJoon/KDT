<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테마 변경하기</title>
    <style>
        /* 기본 상태: 라이트 모드 */
        body {
            background-color: white;
            color: black;
            margin: 0;
            transition: background-color 0.3s, color 0.3s; /* 부드러운 전환 효과 */
        }

        /* 다크 모드 상태 */
        body.dark-mode {
            background-color: black;
            color: white;
        }

        /* 버튼을 화면 중앙에 정렬 */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 버튼 스타일 */
        button {
            padding: 20px;
            cursor: pointer;
            font-size: 30px;
            border: 2px solid currentColor; /* 글자 색상에 맞춰 테두리 색상 자동 변경 */
            background-color: transparent; /* 배경을 투명하게 해서 부모(body) 색상이 보이도록 */
            color: inherit; /* 부모(body)의 글자 색상을 상속받음 */
        }

        button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="toggleTheme()">테마변경</button>
    </div>

    <script>
        // 1. 페이지가 로드되면 저장된 테마를 불러와서 적용합니다.
        function applySavedTheme() {
            const savedTheme = localStorage.getItem('themeSettings');
            
            if (savedTheme) {
                // JSON 문자열을 다시 자바스크립트 객체로 변환 (파싱)
                const settings = JSON.parse(savedTheme);
                
                if (settings.isDark) {
                    document.body.classList.add('dark-mode');
                }
            }
        }

        // 2. 버튼을 누를 때마다 실행되는 함수 (토글 및 저장)
        function toggleTheme() {
            // body에 'dark-mode' 클래스가 있으면 제거하고, 없으면 추가합니다.
            const isDarkNow = document.body.classList.toggle('dark-mode');

            // 저장할 데이터를 객체로 만듭니다.
            const themeSettings = {
                isDark: isDarkNow,
                updatedAt: new Date().toLocaleString() // 언제 변경했는지 데이터 예시
            };

            // 객체를 JSON 문자열로 변환하여 브라우저 로컬 스토리지에 저장합니다.
            localStorage.setItem('themeSettings', JSON.stringify(themeSettings));
        }

        // 페이지 시작 시 즉시 실행하여 이전 상태 복구
        applySavedTheme();
    </script>
</body>
</html>
