<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 2px;
            padding: 0;
        }

        .container {
            width: 100%;
            margin: 20px auto;
            border: 2px solid #ff0000;
            height: auto;
        }

        header,
        footer {
            padding: 20px;
            border: 2px dotted #ff0000;
            margin: 10px;
            height: 200px;
        }

        main {
            margin: 10px;
            border: 2px solid #ff0000;
            padding: 10px;
        }

        .left {
            float: left;
            width: 18.9%;
            height: 500px;
            border: 2px dashed #0004ff;
            padding: 20px;
            margin-right: 5px;
        }

        .middle {
            float: left;
            width: 60%;
            height: 500px;
            border: 2px dashed #0004ff;
            padding: 20px;
            margin-right: 5px;
        }

        .right {
            float: left;
            width: 18.9%;
            height: 500px;
            border: 2px dashed #0004ff;
            padding: 20px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            헤더 영역
        </header>
        <main>
            <aside class="left">
                왼쪽 광고
            </aside>
            <section class="middle">
                중간 컨텐츠
            </section>
            <aside class="right">
                오른쪽 광고
            </aside>
            <div class="clear"></div>
        </main>
        <footer>
            푸터 영역
        </footer>
    </div>
</body>

</html>
