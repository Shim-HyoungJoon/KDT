<!DOCTYPE html>   <!--html version5를 의미, 첫줄에서 html의 버전을 알 수 있다--> <!--(태그 속성)식으로 코드 작성-->
<html lang="ko">  <!--언어정보: 시각장애인을 위한 언어를 설정해줄 수 있다-->
<head>            <!--head: 문서 정보-->
    <meta charset="UTF-8"> <!--meta: 정보를 세팅-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!--반응형 화면을 위한 정보-->
    <title>HTML</title> <!--제목표시줄에 들어가는 정보-->
</head>
<body>            <!--body: 실제 화면에 나오는 내용-->
    <!--
        HTML 주석문
        작성일: 2026-06-10
        작성자: 나
    -->
    HTML 이란?
</body>
</html>
