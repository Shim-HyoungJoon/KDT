<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트</title>
</head>

<body>
    <!-- 
        content: 내용이 나오는 공간
        padding: 내용과 테두리 사이의 여백
        border: 내용에 대한 테두리 공간
        margin: 여백 공간
    -->

    <!-- 
        블록 태그 : 한 줄 전체를 차지하며 줄바꿈이 자동으로 발생함 (제목태그, 문단태그, 서식태그)
        인라인 태그 : 내용만큼만 공간을 차지하며 줄바꿈이 발생하지 않음 (일반적인 글자, 이미지)

        코드 자동 정렬: Shift + Alt + f
        코드 복사 : Shift + Alt + 화살표
    -->

    <!-- 제목 태그 -->
    <h1>안녕하세요. Heading</h1>여기에 문자를 입력하면 아래로 내려감
    <h2>안녕하세요. Heading</h2>
    <h3>안녕하세요. Heading</h3>
    <h4>안녕하세요. Heading</h4>
    <h5>안녕하세요. Heading</h5>
    <h6>안녕하세요. Heading</h6>
    일반 텍스트1
    일반 텍스트2
    일반 텍스트3
    일반&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;텍스트4 <!--&nbsp; : 한칸 띄우기-->
    일반 텍스트5<br>일반 텍스트6 <!-- <br>: 줄바꿈 태그 -->
    <hr> <!-- 줄바꿈 태그 -->

    <!-- 문단 태그 -->
    <p>문단을 만드는 태그</p>일반 텍스트

    <!-- 서식 태그 -->
    <p><b>굵게</b> 표현하기</p>
    <p><strong>굵게</strong> 표현하기</p> <!-- strong태그를 쓰면 장애인 음성지원시 더 강하게 읽어줌 -->
    <p><i>이탤릭체</i> 표현하기</p>
    <p><em>이탤릭체</em> 표현하기</p>
    <p><ins>밑줄</ins> 표현하기</p>
    <p><del>삭제</del> 표현하기</p>
    <p>x<sup>2</sup> + y<sup>3</sup> = z</p> <!-- 윗첨자 -->
    <p>H<sub>2</sub>O</p> <!-- 아랫첨자 -->

</body>

</html>
